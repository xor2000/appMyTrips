<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b8f94" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <title>MyTrips</title>
    <script>
      // Thème mémorisé, appliqué avant le premier affichage (voir src/lib/theme.ts).
      try {
        var theme = localStorage.getItem('mytrips.theme');
        if (['pastel-light', 'pastel-dark', 'carnet'].indexOf(theme) >= 0) {
          document.documentElement.setAttribute('data-theme', theme);
        }
        // Taille d'affichage mémorisée (voir src/lib/scale.svelte.ts).
        var scale = localStorage.getItem('mytrips.scale');
        if (scale === '80' || scale === '90') {
          document.documentElement.style.setProperty('--zoom', String(Number(scale) / 100));
        }
      } catch (e) {
        // Stockage bloqué : thème automatique.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
